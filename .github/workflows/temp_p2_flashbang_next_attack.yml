name: temp-p2-flashbang-next-attack
on:
  push:
    branches: [refactor/v1.01-core-cleanup]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1.01-core-cleanup
      - run: python .github/scripts/temp_p2_flashbang_next_attack.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/core-rule-full.md docs/CORE_V1_01_P0_DECISIONS.md docs/SCENARIO_V1_01_RESOURCE_BALANCE_AUDIT.md
          git diff --cached --quiet || git commit -m "feat: apply flashbang to next enemy attack [skip ci]"
          git push
