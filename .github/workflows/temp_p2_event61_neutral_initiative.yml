name: temp-p2-event61-neutral-initiative
on:
  push:
    branches: [refactor/v1.01-core-cleanup]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1.01-core-cleanup
      - name: Apply approved Event61 neutral initiative rule
        run: python .github/scripts/temp_p2_event61_neutral_initiative.py
      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scenarios/missions/d66_lvl10-16_mission_01_blacksun.md docs/SCENARIO_V1_01_RESOURCE_BALANCE_AUDIT.md
          git diff --cached --quiet || git commit -m "fix: define Event61 combat after neutral reaction [skip ci]"
          git push
