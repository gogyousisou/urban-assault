name: temp-p2-notation-and-vehicle-resolution

on:
  push:
    branches:
      - refactor/v1.01-core-cleanup

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1.01-core-cleanup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply notation and vehicle-resolution clarifications
        run: python .github/scripts/temp_p2_notation_and_vehicle_resolution.py
      - name: Commit changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add core/core-rule-full.md scenarios/missions/d66_lvl10-16_mission_01_blacksun.md docs/SCENARIO_V1_01_RESOURCE_BALANCE_AUDIT.md
            git commit -m "fix: clarify 1d2 notation and final vehicle attack resolution [skip ci]"
            git push origin HEAD:refactor/v1.01-core-cleanup
          fi
