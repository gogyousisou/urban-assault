name: Normalize LMG ammo wording v1.01

on:
  push:
    branches:
      - refactor/v1.01-core-cleanup
    paths:
      - '.github/workflows/normalize-lmg-ammo-v101.yml'
      - 'scripts/normalize_lmg_ammo_v101.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1.01-core-cleanup
          fetch-depth: 0

      - name: Normalize LMG and Gunner ammo wording
        run: python scripts/normalize_lmg_ammo_v101.py

      - name: Commit wording normalization
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add core/core-rule-full.md docs/CORE_V1_01_P0_DECISIONS.md
          git commit -m "Normalize LMG and Gunner ammo wording" || echo "No changes"
          git push origin HEAD:refactor/v1.01-core-cleanup
