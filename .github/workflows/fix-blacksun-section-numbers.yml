name: Fix Black Sun section numbering

on:
  push:
    branches:
      - refactor/v1.01-core-cleanup
    paths:
      - '.github/workflows/fix-blacksun-section-numbers.yml'
      - 'scripts/fix_blacksun_section_numbers.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1.01-core-cleanup
          fetch-depth: 0

      - name: Fix section numbering
        run: python scripts/fix_blacksun_section_numbers.py

      - name: Commit numbering fix
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add scenarios/missions/d66_lvl12-16_mission_01_blacksun.md
          git commit -m "Fix Black Sun section numbering" || echo "No changes"
          git push origin HEAD:refactor/v1.01-core-cleanup
