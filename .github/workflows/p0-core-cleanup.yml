name: Apply v1.01 P0 cleanup

on:
  push:
    branches:
      - refactor/v1.01-core-cleanup
    paths:
      - '.github/workflows/p0-core-cleanup.yml'
      - 'scripts/apply_v101_p0_cleanup.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1.01-core-cleanup
          fetch-depth: 0

      - name: Apply approved P0 cleanup
        run: python scripts/apply_v101_p0_cleanup.py

      - name: Commit P0 cleanup
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add core/core-rule-full.md
          git commit -m "Apply v1.01 P0 cleanup and original wording" || echo "No changes"
          git push origin HEAD:refactor/v1.01-core-cleanup
