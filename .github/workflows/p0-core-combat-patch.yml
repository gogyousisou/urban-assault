name: Apply v1.01 P0 combat decisions

on:
  push:
    branches:
      - refactor/v1.01-core-cleanup
    paths:
      - '.github/workflows/p0-core-combat-patch.yml'
      - 'scripts/apply_v101_p0_combat.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1.01-core-cleanup
          fetch-depth: 0

      - name: Apply approved combat rule patch
        run: python scripts/apply_v101_p0_combat.py

      - name: Commit approved combat rule changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add core/core-rule-full.md
          git commit -m "Apply approved v1.01 combat rule decisions" || echo "No changes"
          git push origin HEAD:refactor/v1.01-core-cleanup
