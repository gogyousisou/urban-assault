name: Apply P1 repository renames

on:
  push:
    branches:
      - refactor/v1.01-core-cleanup
    paths:
      - '.github/workflows/p1-repository-renames.yml'
      - 'scripts/apply_p1_repository_renames.py'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1.01-core-cleanup
          fetch-depth: 0

      - name: Apply approved P1 renames
        run: python scripts/apply_p1_repository_renames.py

      - name: Commit P1 renames
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Apply approved P1 repository renames" || echo "No changes"
          git push origin HEAD:refactor/v1.01-core-cleanup
