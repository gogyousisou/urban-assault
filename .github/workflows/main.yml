name: Build Core Rulebook

on:
  push:
    paths:
      - 'core/core-rule-full.md'
      - '.github/workflows/main.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build core rulebook source
        run: |
          mkdir -p build
          cp core/core-rule-full.md build/core-full.md

      - name: Commit built file
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add build/core-full.md
          git commit -m "Auto build core-full.md" || echo "No changes"
          git push
