- event_id: epilogue
  source_ref: main_route
  event_role: epilogue
  category_id: null
  title: エピローグ
  logic_authority: prose
  text_anchor: epilogue
  logic_summary:
    summary: '運転手は分隊の合図を受け、最初のトラックを橋へ進めた。重いタイヤが継ぎ目を越えるたび、荷台の幌が揺れる。一台が渡り終えると、次の一台が続いた。分隊長は最後尾の車両が橋を離れるまで、その背中を見送っていた。

      しばらくして、救護所から無線が入った。車列は無事に到着したという。受信機の向こうでは、エンジンの音に混じって人を呼ぶ声がしている。運び込まれた箱は入口に積まれる間もなく開けられ、薬と包帯が処置室へ運ばれていった。

      「受領を確認した。助かった」

      短い報告が終わると、無線は途切れた。分隊長は受信機を下ろし、来た道を振り返る。建物の陰を選び、補給を確かめ、ここまで通ってきた道路だ。今はその道を、空になったトラックが戻ってくる。橋の手前で止まる必要はもうなかった。

      分隊長は車列の通過を報告し、帰還の準備に取りかかった。街の戦闘はまだ終わっていない。それでも、待っていた物資は届いた。救護所の入口では、次の担架を迎えるために扉が開け放たれていた。'
    success: 成功のエピローグを読み、作戦終了後の処理へ進む。
    failure: 失敗時の物語エピローグは設けず、Coreの終了・再編を行う。
