- event_id: prologue
  source_ref: main_route
  event_role: support
  category_id: null
  title: プロローグ
  logic_authority: prose
  text_anchor: prologue
  logic_summary:
    summary: '救護所へ医療物資を届ける車列が、市街地の手前で止まっていた。橋へ続く道路には敵の検問があり、橋の入口にも装甲車両を伴う部隊が居座っている。車列は、その二か所を通らなければ救護所へ着けない。

      車列を待機させ、分隊は市街地へ先行する。道路と橋の通行を確保してから、車列を呼び寄せる手はずだった。手持ちの弾薬だけで戦い続ける余裕はない。道中物資を集めながら、道路と橋の通行を確保する。

      - 任務：道路と橋を通れる状態にし、医療物資を届ける。

      - 成功：最終イベントを解決し、車列の救護所到着を確認する。

      - 失敗：分隊長の戦死、任務放棄、中間イベントまたは最終イベントからの分隊退却。

      成功または失敗が確定したら、作戦を終了します。車列の到着確認に追加の判定はありません。

      | 出目 | イベント | 属性 |

      |---|---|---|

      | 11 | 待機所の配給 | 屋外 |

      | 12 | 救護所での処置 | 室内 |

      | 13 | 路肩の補給車 | 屋外 |

      | 21 | AT4 | 屋外 |

      | 22 | 放棄された補給所 | 室内 |

      | 23 | 補給品の運搬 | 屋外 |

      | 31 | 集合地点の物資交換 | 屋外 |

      | 32 | 帰還を待つ工兵 | 屋外 |

      | 33 | 偵察兵の案内 | 屋外 |

      各マップの選択は、一度だけ行います。支払いや受入条件を確認してから選んでください。'
    success: 本文に定めた成功・解決条件を満たす。
    failure: 選択肢の不成立・判定失敗の結果と進行は本文に従う。
    progress_on_failure: false
    entity_refs:
      events: []
      enemies: []
      npcs: []
      locations:
